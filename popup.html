<html lang="en">

<head>
    <title>Lichess Style</title>
    <link rel="stylesheet" type="text/css" href="popup.css">
    <link rel="stylesheet" href="/chessboardJs/css/chessboard-1.0.0.css">
    <script src="/chessboardJs/jquery-4.0.0.js"></script>
    <script src="chessboardJs/js/chessboard-1.0.0.js"></script>
</head>

<body>
    
    <div class="container">

        <h1>Lichess Board Visualizer</h1>
        
        <div class="board-container">
            <div class="no-board-container">
                <p>No active lichess game found on this page</p>
                <p>Try reloading the page or switching to a tab with lichess.org open</p>
                <img src="assets/CustomPieces/wkm.png"/>
            </div>
            <div id="myBoard"></div>
        </div>

        <div class="block">
            <h2> Enable custom style</h2>
            <label class="checkbox">
                <input id="styleCheckbox" type="checkbox" checked>
                <span></span>
            </label>
        </div>
        
        <div class="button-container">
            <button id="reload">reload</button>
            <button id="back"> < </button>
            <button id="counter">0</button>
            <button id="forward"> > </button>
            <button id="flip">flip</button>
        </div>
        </div>

        <script src="popup.bundle.js"></script>
</body>

</html>
